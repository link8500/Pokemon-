<!DOCTYPE html>
<html lang="es">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Explora el mundo Pokémon: búsqueda inteligente, filtros, favoritos y estadísticas con datos de PokéAPI.">
  <meta name="theme-color" content="#ED4B4E">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Pokédex">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/pokedex-180-v2.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" sizes="32x32" href="icons/pokedex-32-v2.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/pokedex-192-v2.png">
  <link rel="icon" type="image/svg+xml" sizes="any" href="favicon.svg?v=2">

  <title>Pokédex · Tu próxima aventura</title>
  <link rel="manifest" href="manifest.json?v=2">
  <style>
    html, body { margin: 0; background: #f7f8fa; color-scheme: light; }
  </style>
</head>
<body>
  <div id="loading" role="status" aria-label="Cargando Pokédex" style="position:fixed;top:0;right:0;bottom:0;left:0;display:grid;place-content:center;gap:18px;text-align:center;background:#f7f8fa;font:15px system-ui;color:#8b929d">
    <img src="favicon.svg" width="48" height="48" alt="" style="margin:auto">
    Preparando tu próxima aventura…
  </div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var loading = document.getElementById('loading');
      if (loading) loading.remove();
    });
  </script>
  <noscript>Activa JavaScript para usar la búsqueda de la Pokédex.</noscript>
  <script src="app-loader.js?v=__POKEDEX_BUILD__" defer></script>
</body>
</html>
